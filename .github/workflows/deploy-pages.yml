name: Col Tur'u GitHub Pages'a Yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
      - name: Node.js'i hazırla
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Bağımlılıkları kur
        run: npm ci
      - name: Siteyi oluştur
        run: npm run build
      - name: Pages yapısını hazırla
        uses: actions/configure-pages@v5
      - name: Site dosyalarını yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Yayınla
        id: deployment
        uses: actions/deploy-pages@v4
